upstream xlloop_node {
    server 127.0.0.1:3100;
    keepalive 16;
}

# Keep POST login throttling separate so normal API traffic is not rate limited.
# An empty key is not recorded, so other methods do not consume this limit.
map $request_method $xlloop_login_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $xlloop_login_limit_key zone=xlloop_login:10m rate=5r/m;

server {
    listen 80;
    server_name xlloop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xlloop.example.com;

    ssl_certificate     /etc/nginx/ssl/xlloop.crt;
    ssl_certificate_key /etc/nginx/ssl/xlloop.key;

    client_max_body_size 2m;

    location = /api/auth/login {
        limit_req zone=xlloop_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://xlloop_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://xlloop_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
